<rect width="1420" height="760" fill="#fffcf5"/>
<text x="36" y="42" font-family="Georgia,serif" font-size="25" fill="#263c31">Storage schema · where a save goes</text>
<text x="36" y="68" font-family="Segoe UI,sans-serif" font-size="13" fill="#657267">Logical relationships. Different tables represent candidates, decisions, source inputs and public output.</text>
<text x="40" y="638" font-family="Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#657267">NO SAVE WRITES CORRECTIONS BACK INTO THE SOURCE GOOGLE SHEET OR FLORA-EXTRACTOR.</text>
<text x="40" y="666" font-family="Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#657267">A DATABASE EXCEPTION ROLLS BACK THAT TRANSACTION; A LOST HTTP REPLY DOES NOT PROVE NO SAVE OCCURRED. PIPELINES HAVE MULTIPLE COMMITS.</text>
