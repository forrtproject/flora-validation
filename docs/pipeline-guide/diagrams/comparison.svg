<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="comparison-title comparison-desc">
<title id="comparison-title">Source Records and FLoRA: inputs, current view, stored output</title><desc id="comparison-desc">Source Records preserves the imported inputs. FLoRA combines and corrects them. Full CSV and API read the stored dataset. Each box links to its explanatory README.</desc>
<defs><marker id="comparison-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#78877a"/></marker></defs>
<rect width="1600" height="900" fill="#fffcf5"/>
<text x="36" y="42" font-family="Georgia,serif" font-size="25" fill="#263c31">Source Records and FLoRA: inputs, current view, stored output</text>
<text x="36" y="68" font-family="Segoe UI,sans-serif" font-size="13" fill="#657267">Source Records preserves the imported inputs. FLoRA combines and corrects them. Full CSV and API read the stored dataset.</text>
<text x="40" y="125" font-family="Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#657267">01 · INSPECT THE INPUT</text>
<text x="620" y="125" font-family="Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#657267">02 · APPLY THE RULES</text>
<text x="1200" y="125" font-family="Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#657267">03 · REVIEW THE COMBINED VIEW</text>
<text x="40" y="770" font-family="Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#657267">THE TABS MAY HAVE DIFFERENT COUNTS: SEVERAL INPUTS CAN COMBINE INTO ONE RECORD; EXCLUSIONS CAN REMOVE OTHERS.</text>
<text x="40" y="803" font-family="Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#657267">REFRESH RELOADS A VIEW. RUN PIPELINE REBUILDS THE FULL STORED DATASET. GITHUB PUBLICATION IS A SEPARATE STEP.</text>
<polyline points="400,222 620,222" fill="none" stroke="#78877a" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#comparison-arrow)"/>
<text x="435" y="206" font-family="Segoe UI,sans-serif" font-size="11" fill="#657267" paint-order="stroke" stroke="#fffcf5" stroke-width="5">read imported inputs</text>
<polyline points="980,222 1200,222" fill="none" stroke="#78877a" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#comparison-arrow)"/>
<text x="1000" y="206" font-family="Segoe UI,sans-serif" font-size="11" fill="#657267" paint-order="stroke" stroke="#fffcf5" stroke-width="5">build / reuse current view</text>
<polyline points="1380,285 1380,355" fill="none" stroke="#78877a" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#comparison-arrow)"/>
<text x="1393" y="326" font-family="Segoe UI,sans-serif" font-size="11" fill="#657267" paint-order="stroke" stroke="#fffcf5" stroke-width="5">Save changes</text>
