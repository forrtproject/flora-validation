name: PostgreSQL integration tests

on:
  pull_request:
    paths:
      - '*.py'
      - 'adjudication/**'
      - 'pipeline/**'
      - 'extractor/**'
      - 'shared/**'
      - 'db_schema.sql'
      - 'tests/integration/**'
      - 'tests/pg_fixtures.py'
      - '.github/workflows/test-integration.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flora_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U flora_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run PostgreSQL integration suite
        env:
          FLORA_TEST_DATABASE_URL: postgresql://flora_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: python -m pytest -q -o addopts="" -m pg tests/
