name: Daily validated export

on:
  schedule:
    # 04:00 UTC every day. NOTE: GitHub cron is always UTC (no DST).
    # For 04:00 CET use "0 3 * * *" (winter) / CEST is 02:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch: {}   # also allow manual runs from the Actions tab

# Needed so the job can push the refreshed CSVs back to the repo.
permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python export_validated.py

      # The nightly sync and Publish FLoRA push to this branch too; the script
      # retries on the new tip if one of them pushed after this checkout.
      - name: Commit updated exports (if changed)
        run: >-
          bash .github/scripts/commit_and_push.sh
          "chore: daily validated export ($(date -u +%Y-%m-%d))" ""
          data/validated_export.csv data/needs_manual_refs.csv oa_ref_cache.json
