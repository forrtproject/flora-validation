name: Publish FLoRA

# Writes the stored FLoRA dataset (flora_data) to output/ and commits it when
# flora.csv changed, so other repositories read the same file the website
# downloads. Started two ways:
#   - once a day, as soon as the nightly "Sync entry sheets" job (03:00 UTC)
#     finishes, whether it succeeded or not. After a good night it finds flora.csv
#     already committed and commits nothing; after a failed one it still publishes
#     the stored dataset with the day's corrections;
#   - by hand from the Actions tab, for instance right after a website Run
#     pipeline (with that run's id, its preparation report comes along).
on:
  workflow_dispatch:
    inputs:
      preprint_alias_history:
        description: "Audit or backfill history-backed missing preprint aliases through the FLoRA change log"
        type: choice
        options: ["off", "audit", "backfill"]
        required: false
        default: "off"
      resolve_published_versions:
        description: "Automatically resolve explicit publication links with matching titles and first authors"
        type: boolean
        required: false
        default: false
      apply_approved_identifier_corrections:
        description: "Apply the reviewed cache/approved_publication_corrections.csv through the FLoRA change log"
        type: boolean
        required: false
        default: false
      job_id:
        description: "Website pipeline run whose preparation report to include (optional)"
        required: false
        default: ""
  workflow_run:
    workflows: ["Sync entry sheets"]
    types: [completed]

# Needed so the job can commit output/.
permissions:
  contents: write

# Publishes queue behind each other. Not shared with the nightly sync: a group
# keeps one waiting run, so a publish could cancel a waiting night. A push that
# races another job's is retried on the new tip (.github/scripts/commit_and_push.sh).
concurrency:
  group: flora-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit replaced preprint identifiers
        if: github.event_name == 'workflow_dispatch' && inputs.preprint_alias_history != 'off'
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALIAS_HISTORY_MODE: ${{ inputs.preprint_alias_history }}
        run: |
          args=()
          if [ "$ALIAS_HISTORY_MODE" = backfill ]; then args+=(--apply); fi
          python backfill_preprint_identifiers.py "${args[@]}" --admin-handle "github-actions:$GITHUB_ACTOR"

      - name: Upload preprint identifier history audit
        if: always() && github.event_name == 'workflow_dispatch' && inputs.preprint_alias_history != 'off'
        uses: actions/upload-artifact@v4
        with:
          name: preprint-alias-history
          path: output/preprint_alias_audit.json
          if-no-files-found: error

      - name: Apply approved identifier corrections
        timeout-minutes: 20
        if: github.event_name == 'workflow_dispatch' && inputs.apply_approved_identifier_corrections
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: python correct_publication_identifiers.py cache/approved_publication_corrections.csv --apply --admin-handle "github-actions:$GITHUB_ACTOR"

      - name: Restore published-version lookup cache
        if: github.event_name == 'workflow_dispatch' && inputs.resolve_published_versions
        uses: actions/cache@v4
        with:
          path: cache/published_versions
          key: published-versions-${{ runner.os }}-${{ github.run_id }}
          restore-keys: published-versions-${{ runner.os }}-

      - name: Resolve verified published versions
        if: github.event_name == 'workflow_dispatch' && inputs.resolve_published_versions
        timeout-minutes: 45
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: python resolve_publication_versions.py --apply

      # Use the normal preparation/validation gate to materialize queued merges.
      - name: Prepare automatically resolved dataset
        if: github.event_name == 'workflow_dispatch' && inputs.resolve_published_versions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: python prepare_flora.py --output-dir output --network-minutes 5

      # The run id reaches the shell through the environment, never through
      # expression substitution into the script.
      - name: Write the stored dataset to output/
        if: github.event_name != 'workflow_dispatch' || !inputs.resolve_published_versions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          if [ -n "$JOB_ID" ]; then
            python publish_flora.py --output-dir output --job "$JOB_ID"
          else
            python publish_flora.py --output-dir output
          fi

      - name: Commit the FLoRA release to output/
        env:
          RELEASE_MANIFEST: output/flora_release_manifest.json
          ORIGIN: ${{ github.event_name == 'workflow_run' && 'after the nightly sync' || inputs.job_id != '' && 'for a website pipeline run' || 'started by hand' }}
        run: >-
          bash .github/scripts/commit_and_push.sh
          "chore: FLoRA release $ORIGIN ($(date -u +%Y-%m-%d))"
          output/flora.csv $(cat .github/release-files.txt)
