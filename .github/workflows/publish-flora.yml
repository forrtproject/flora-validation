name: Publish FLoRA

# Writes the stored FLoRA dataset (flora_data) to output/ and commits it when
# flora.csv changed, so other repositories read the same file the website
# downloads. Started two ways:
#   - once a day, as soon as the nightly "Sync entry sheets" job (03:00 UTC)
#     finishes, whether it succeeded or not. After a good night it finds flora.csv
#     already committed and commits nothing; after a failed one it still publishes
#     the stored dataset with the day's corrections;
#   - by hand from the Actions tab, for instance right after a website Run
#     pipeline (with that run's id, its preparation report comes along).
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Website pipeline run whose preparation report to include (optional)"
        required: false
        default: ""
  workflow_run:
    workflows: ["Sync entry sheets"]
    types: [completed]

# Needed so the job can commit output/.
permissions:
  contents: write

# Publishes queue behind each other. Not shared with the nightly sync: a group
# keeps one waiting run, so a publish could cancel a waiting night. A push that
# races another job's is retried on the new tip (.github/scripts/commit_and_push.sh).
concurrency:
  group: flora-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The run id reaches the shell through the environment, never through
      # expression substitution into the script.
      - name: Write the stored dataset to output/
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          if [ -n "$JOB_ID" ]; then
            python publish_flora.py --output-dir output --job "$JOB_ID"
          else
            python publish_flora.py --output-dir output
          fi

      - name: Commit the FLoRA release to output/
        env:
          RELEASE_MANIFEST: output/flora_release_manifest.json
          ORIGIN: ${{ github.event_name == 'workflow_run' && 'after the nightly sync' || inputs.job_id != '' && 'for a website pipeline run' || 'started by hand' }}
        run: >-
          bash .github/scripts/commit_and_push.sh
          "chore: FLoRA release $ORIGIN ($(date -u +%Y-%m-%d))"
          output/flora.csv $(cat .github/release-files.txt)
