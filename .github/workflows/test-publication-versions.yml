name: Test publication versions
on:
  pull_request:
    paths:
      - '*publication*.py'
      - '*preprint*.py'
      - flora_edits.py
      - manual_records.py
      - export_validated.py
      - sync_validated.py
      - transform_sources.py
      - tests/**
      - .github/workflows/**
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
