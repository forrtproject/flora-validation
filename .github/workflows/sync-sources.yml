name: Sync entry sheets

on:
  schedule:
    # 03:00 UTC — deliberately ahead of the 04:00 daily-export job so the two
    # never contend, and so a night's new rows are in place before the export runs.
    # NOTE: GitHub cron is always UTC (no DST).
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # also allow manual runs from the Actions tab

# Needed so the job can commit the night's FLoRA release to output/.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync entry sheets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sync_sources.py

      # The exclusions sheet plus the lists hard-coded in the R notebook. Runs
      # before the transform reads transform_exclusions.
      - name: Sync exclusions
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sync_exclusions.py

      # Projects our own validated records into the same grid. Runs even when a
      # sheet failed a gate: it reads only the database, so an unshared sheet
      # should not also stop our own records from refreshing. Unlike the sheet
      # sync this one updates changed rows — see the module docstring for why —
      # but never touches a row a human has reviewed in the grid.
      - name: Sync validated records
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sync_validated.py

      # Bibliographic metadata (title/author/journal/year/volume/issue/pages/
      # language/oa_url) for any DOI not already cached in work_metadata. Only new
      # DOIs are fetched, so this is a no-op on most nights.
      - name: Enrich DOI metadata
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: python enrich_works.py

      # Stable ids for the rows the transform will emit. Before the build
      # so the dataset carries them, and if: always() for the same reason as the
      # stage above — it reads only the database.
      - name: Assign FLoRA record ids
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python flora_registry.py

      # Same final command as the website's Run pipeline button. Validation reads
      # the exact CSV snapshot, and the manifest fingerprints its downloaded bytes.
      # Written straight into output/, where the release files are tracked. The
      # build removes transform logs it did not write, so the logs there are
      # always this build's.
      - name: Prepare final FLoRA CSV and reports
        id: build_dataset
        # Source refresh stages still run independently. A failure prevents a
        # current release from silently containing an incomplete source refresh.
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The network checks look up DOIs for originals without one in Crossref,
          # with the contact address enrich_works sends (enrich_works.MAILTO).
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: python prepare_flora.py --output-dir output

      # Only when the build ran: output/ also holds the last release's committed
      # reports. The build writes its report first and clears the old validation
      # reports as it starts, so even a failed build uploads only its own.
      - name: Upload validation report
        if: always() && steps.build_dataset.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: flora-validation-${{ github.run_id }}
          path: |
            output/flora_preparation_report.json
            output/flora_preparation_report.md
            output/flora_validation.md
            output/flora_network_validation.md
          retention-days: 90
          if-no-files-found: warn

      # Also kept as a reviewable artifact: the files this build wrote, not the
      # other files kept in output/. Sync does not create or comment on external
      # review issues.
      - name: Upload FLoRA dataset
        if: steps.build_dataset.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: flora-final-${{ github.run_id }}
          path: |
            output/flora.csv
            output/flora_release_manifest.json
            output/flora_release_notes.md
            output/flora_history.csv
            output/flora_dataset_summary.md
            output/flora_preparation_report.json
            output/flora_preparation_report.md
            output/flora_validation.md
            output/flora_network_validation.md
            output/flora_network_validation.csv
            output/flora_export_log.csv
            output/dup_outcome_conflicts.csv
            output/preprint_dedup_candidates.csv
            output/cross_type_duplicate_rulings.csv
          retention-days: 90
          if-no-files-found: error

      # Other repositories read FLoRA from output/flora.csv: the file this run just
      # stored in flora_data. Download full CSV serves that table, so the two match
      # until a correction is saved in the FLoRA tab (the table has it at once, this
      # file at the next run). A failed build exits non-zero and commits nothing;
      # so does a night whose flora.csv did not change. The files committed are
      # .github/release-files.txt; the manifest's data version keeps a slower job
      # from replacing a newer release (.github/scripts/commit_and_push.sh).
      - name: Commit the FLoRA release to output/
        if: steps.build_dataset.outcome == 'success'
        env:
          RELEASE_MANIFEST: output/flora_release_manifest.json
        run: >-
          bash .github/scripts/commit_and_push.sh
          "chore: nightly FLoRA release ($(date -u +%Y-%m-%d))"
          output/flora.csv $(cat .github/release-files.txt)

      # Snapshots go to artifacts rather than the repo: the payloads are several MB
      # a night and would bloat git permanently. The hash and row count live in
      # source_sync_runs, so the audit trail outlives the 90-day retention.
      - name: Upload sheet snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: entry-sheet-snapshots-${{ github.run_id }}
          path: snapshots/
          retention-days: 90
          if-no-files-found: ignore
