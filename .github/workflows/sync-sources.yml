name: Sync entry sheets

on:
  schedule:
    # 03:00 UTC — deliberately ahead of the 04:00 daily-export job so the two
    # never contend, and so a night's new rows are in place before the export runs.
    # NOTE: GitHub cron is always UTC (no DST).
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # also allow manual runs from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync entry sheets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sync_sources.py

      # The exclusions sheet plus the lists hard-coded in the R notebook. Runs
      # before the transform reads transform_exclusions.
      - name: Sync exclusions
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sync_exclusions.py

      # Projects our own validated records into the same grid. Runs even when a
      # sheet failed a gate: it reads only the database, so an unshared sheet
      # should not also stop our own records from refreshing. Unlike the sheet
      # sync this one updates changed rows — see the module docstring for why —
      # but never touches a row a human has reviewed in the grid.
      - name: Sync validated records
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sync_validated.py

      # Bibliographic metadata (title/author/journal/year/volume/issue/pages/
      # language/oa_url) for any DOI not already cached in work_metadata. Only new
      # DOIs are fetched, so this is a no-op on most nights.
      - name: Enrich DOI metadata
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: python enrich_works.py

      # Stable ids for the rows the transform will emit. Before the build
      # so the dataset carries them, and if: always() for the same reason as the
      # stage above — it reads only the database.
      - name: Assign FLoRA record ids
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python flora_registry.py

      # Same final command as the website's Run pipeline button. Validation reads
      # the exact CSV snapshot, and the manifest fingerprints its downloaded bytes.
      - name: Prepare final FLoRA CSV and reports
        id: build_dataset
        # Source refresh stages still run independently. A failure prevents a
        # current release from silently containing an incomplete source refresh.
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python prepare_flora.py --output-dir output/prepared

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flora-validation-${{ github.run_id }}
          path: |
            output/prepared/flora_preparation_report.json
            output/prepared/flora_preparation_report.md
            output/prepared/flora_validation.md
            output/prepared/flora_network_validation.md
          retention-days: 90
          if-no-files-found: warn

      # Files remain reviewable artifacts. Sync does not publish a dataset release
      # or create/comment on external review issues.
      - name: Upload FLoRA dataset
        if: steps.build_dataset.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: flora-final-${{ github.run_id }}
          path: |
            output/prepared/
          retention-days: 90
          if-no-files-found: error

      # Snapshots go to artifacts rather than the repo: the payloads are several MB
      # a night and would bloat git permanently. The hash and row count live in
      # source_sync_runs, so the audit trail outlives the 90-day retention.
      - name: Upload sheet snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: entry-sheet-snapshots-${{ github.run_id }}
          path: snapshots/
          retention-days: 90
          if-no-files-found: ignore
