# Holds EXTRACTOR_DATA_DIR: extracted_latest.csv plus the per-run snapshot
# archives the orphan report and retire stage re-read, by sha256. The database
# keeps a copy of every imported snapshot (extractor_snapshots), so losing this
# volume no longer blocks the sync; keeping it saves re-reading that copy after
# every pod replacement. ReadWriteMany (manilabronze) so any replica can run it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flora-app-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manilabronze
  resources:
    requests:
      storage: 10Gi
