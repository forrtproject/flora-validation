# Reference only — do NOT `kubectl apply -f` this file and do NOT commit a
# filled-in copy to git. It documents exactly which keys the app and the
# Postgres image expect. Create the real secrets imperatively instead, e.g.:
#
#   kubectl create secret generic flora-postgres-secrets -n <namespace> \
#     --from-literal=POSTGRES_USER=flora \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=POSTGRES_DB=flora
#
#   kubectl create secret generic flora-secrets -n <namespace> \
#     --from-literal=DATABASE_URL="postgresql://flora:<same-password-as-above>@flora-postgres:5432/flora" \
#     --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=GEMINI_API_KEY="AIzaSy..." \
#     --from-literal=RESEND_API_KEY="re_..." \
#     --from-literal=GITHUB_TOKEN=""
#
# See docs/KUBERNETES_DEPLOYMENT.md for the full walkthrough, including the
# External Secrets Operator alternative if you enable ESO on the project form.
apiVersion: v1
kind: Secret
metadata:
  name: flora-postgres-secrets
type: Opaque
stringData:
  POSTGRES_USER: flora
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: flora
---
apiVersion: v1
kind: Secret
metadata:
  name: flora-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://flora:CHANGE_ME@flora-postgres:5432/flora
  ADMIN_PASSWORD: CHANGE_ME_LONG_RANDOM_SECRET
  GEMINI_API_KEY: CHANGE_ME
  RESEND_API_KEY: CHANGE_ME
  GITHUB_TOKEN: ""
